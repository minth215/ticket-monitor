name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install chromium --with-deps

      - name: Scrape ticket data
        run: npx tsx scripts/scrape.ts
        timeout-minutes: 3
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ""
        continue-on-error: true

      # Every scheduled run redeployed under the same commit SHA (pages_build_version),
      # since only the generated tickets.json changed, not the code. GitHub Pages' CDN
      # was never invalidating its cache for same-SHA deployments, so the live site got
      # stuck serving whatever was cached from the first deployment of the last commit.
      # Committing the scraped data gives every run a genuinely new SHA to deploy under.
      #
      # Push to github.ref_name (whatever branch actually triggered this run), NOT a
      # hardcoded "main" — the repo's default branch (what schedule/no-ref triggers check
      # out) turned out to be claude/concert-ticket-scraper-eknnq7, not main. Hardcoding
      # main caused every scheduled run to push against a branch it never checked out,
      # diverging from main and getting rejected as a non-fast-forward once main moved
      # ahead, which failed this whole step (and skipped build+deploy, breaking updates
      # entirely — worse than the original staleness bug). Also made non-fatal so a
      # future push conflict can't take down the deploy again.
      - name: Commit scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tickets.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update scraped ticket data [skip ci]"
          git push origin HEAD:${{ github.ref_name }} || echo "::warning::Failed to push scraped-data commit; this run still deploys fresh data, just without a new commit for cache-busting."

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
